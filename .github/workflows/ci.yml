name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Test with coverage
        run: coverage run -m pytest -q && coverage report --fail-under=70
      - name: Run offline evaluation
        run: python tests/run_eval.py

  database-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL
        run: docker compose up -d --wait
      - name: Verify PostgreSQL readiness
        run: docker compose exec -T postgres pg_isready -U app_user -d companies
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v