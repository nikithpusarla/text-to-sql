services:
  postgres:
    image: postgres:16-alpine
    container_name: text2sql-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-companies}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/seed_data.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-companies}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
